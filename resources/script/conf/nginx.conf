
user  root;
master_process on;
worker_processes  auto;

worker_rlimit_nofile 102400;

error_log  logs/error.log debug;

events {
    use epoll;
    accept_mutex off;
    multi_accept on;
    worker_connections  102400;
}

worker_rlimit_core  10M;

# shuting down的进程1秒关闭
worker_shutdown_timeout 1s;

# http协议代理
http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      $http_connection;
    }

    include       mime.types;
    default_type  application/octet-stream;

    #客户端传输的数据体积
    client_max_body_size 1024M;
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;
    server_names_hash_bucket_size 128;
    underscores_in_headers on;
    uninitialized_variable_warn off;

    #清除sever头
    more_clear_headers "Server";
    #清除Allow头
    more_clear_headers "Allow";

    open_file_cache  max=1000 inactive=60;
    # http2链路的维护时间和这个参数相关
    keepalive_timeout 120s;
    # 链路请求计数达到多少，断开链路，客户端重新建链
    keepalive_requests 100000;

    client_header_timeout 60s;
    client_body_timeout 60s;

    gzip off;

    proxy_connect_timeout   300s;
    proxy_send_timeout      900s;
    proxy_read_timeout      900s;

    proxy_buffer_size 64k;           #设置代理服务器（nginx）保存用户头信息的缓冲区大小              4k
    proxy_buffers 4 64k;            #proxy_buffers缓冲区，网页平均在128k以下的设置      4 64k     8 16k
    proxy_busy_buffers_size 128k;    #高负荷下缓冲大小（proxy_buffers*2）               128k    32k
    proxy_max_temp_file_size 10m;    #设定缓存文件夹大小，大于这个值，将从upstream服务器传
    proxy_temp_file_write_size 128k; #一次访问能写入的临时文件的大小，默认是proxy_buffer_size和proxy_buffers中设置的缓冲区大小的2倍  128k

    proxy_pass_header X-Accel-Buffering; # nginx内置头 透传

    proxy_ignore_client_abort on;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    log_format access '"$remote_addr" "$http_x_forwarded_for" "$http_x_real_ip" "$remote_user" [$time_local] [$msec] "$request" '
                      '$status $upstream_status $body_bytes_sent "$host" "$upstream_addr" "$http_referer" '
                      '"$http_user_agent" "$http_cookie" "total_time:$request_time" "upstream_time:$upstream_response_time" ';

    access_log  {op-dir}/logs/access.log access;
    error_log  {op-dir}/logs/error.log debug;

    error_page 400 401 402 404 /40x.html;
    error_page 500 502 503 504 /50x.html;

    lua_http10_buffering off;

    lua_regex_match_limit 100000;
    lua_regex_cache_max_entries 8192;
    lua_socket_log_errors off;

    lua_max_pending_timers 2048;
    lua_max_running_timers 2048;

    #代理域名时，需要设置dns
    resolver 114.114.114.114 valid=3600s;
    resolver_timeout 15s;

    # 攻击训练
    lua_shared_dict waf_train 20m;
    # 攻击样本token权重
    lua_shared_dict waf_w 20m;
    # 样本置信度
    lua_shared_dict waf_c 20m;

    lua_shared_dict waf_block 20m;

    lua_package_path "{op-dir}/adapt-waf/?.lua;{op-dir}/lualib/?.lua;{op-dir}/luajit/share/lua/5.1/?.lua;;";
    lua_package_cpath "{op-dir}/lualib/?.so;{op-dir}/luajit/lib/lua/5.1/?.so;;";

    init_by_lua_block {
        require ("resty.core")

        local init        = require("waf.init")

        context = {
            init          = init
        }
    }

    init_worker_by_lua_block {
        local init       = context.init

        init.init_worker()
    }

    include server.conf;
}

