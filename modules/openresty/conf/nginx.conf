worker_processes auto;
pcre_jit on;

events {
    worker_connections 4096;
}

http {
    lua_package_path "$prefix/lua/?.lua;$prefix/lua/?/init.lua;;";

    lua_shared_dict waf_control 20m;
    lua_shared_dict waf_blacklist 20m;

    log_format waf_alert_format '$waf_alert_json';
    log_format waf_sample_format '$waf_sample_json';
    log_format waf_trace_format '$waf_trace_json';

    # 使用 Nginx 原生日志缓冲降低磁盘 I/O 频率。
    open_log_file_cache max=2000 inactive=30s valid=60s min_uses=2;

    upstream app_backend {
        server 127.0.0.1:9000;
        keepalive 256;
    }

    init_worker_by_lua_block {
        require("waf.interceptor.init").init_worker()
    }

    server {
        listen 8080;
        server_name _;

        location / {
            # 日志变量必须在请求早期初始化，供 log 阶段填充并由 access_log 落盘。
            set $waf_alert_json "-";
            set $waf_alert_loggable 0;
            set $waf_sample_json "-";
            set $waf_sample_loggable 0;
            set $waf_trace_json "-";
            set $waf_trace_loggable 0;

            access_log /var/log/nginx/waf-alert.ndjson waf_alert_format buffer=512k flush=5s if=$waf_alert_loggable;
            access_log /var/log/nginx/waf-sample.ndjson waf_sample_format buffer=512k flush=5s if=$waf_sample_loggable;
            access_log /var/log/nginx/waf-trace.ndjson waf_trace_format buffer=512k flush=5s if=$waf_trace_loggable;

            access_by_lua_block {
                require("waf.interceptor.init").run_access()
            }

            proxy_pass http://app_backend;

            log_by_lua_block {
                require("waf.interceptor.init").run_log()
            }
        }
    }

    server {
        listen 18080;
        server_name _;

        location ~ ^/_waf/internal/exemptions/(publish|status|rollback)$ {
            content_by_lua_block {
                require("waf.admin.init").dispatch()
            }
        }

        location = /_waf/internal/healthz {
            return 200 "ok\n";
        }
    }
}
